apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-dashboard
  namespace: devops-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-dashboard

  template:
    metadata:
      labels:
        app: devops-dashboard

    spec:
      containers:
      - name: dashboard
        image: raj25522/devops-dashboard:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"